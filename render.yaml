services:
  - type: web
    name: datanexus-ai-backend
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    rootDir: backend

    envVars:
      # ── Python version pin ─────────────────────────────────────────────
      # PYTHON_VERSION is the authoritative way to pin Python on Render.
      # runtime.txt / .python-version are also present as belt-and-suspenders,
      # but this env var takes effect regardless of rootDir resolution.
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Database ───────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false

      # ── AI ─────────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      # ── Auth ───────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true

      # ── CORS ───────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        sync: false

      # ── File uploads (ephemeral /tmp — always writable on Render) ──────
      - key: UPLOAD_DIR
        value: /tmp/datanexus_uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
